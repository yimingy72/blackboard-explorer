[project]
name = "bbx-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bbx-contracts",
    "bbx-objects",
    "agent-framework-core==1.19.0",
    "agent-framework-openai==1.14.4",
    "agent-framework-anthropic==1.0.0b260918",
    "agent-framework-bedrock==1.0.0b260918",
    "agent-framework-gemini==1.0.0b260910",
    "agent-framework-ollama==1.0.0b260813",
    "agent-framework-mistral==1.0.0b260918",
    "agent-framework-foundry==1.13.1",
    "mcp>=1.24,<2",
    "docker>=7,<8",
    "httpx>=0.28,<1",
    "socksio>=1,<2",
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "asyncpg>=0.30,<1",
    "zstandard>=0.25,<1",
]

[tool.uv.sources]
bbx-objects = { workspace = true }
bbx-contracts = { workspace = true }

[project.scripts]
bbx-runtime = "bbx_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
