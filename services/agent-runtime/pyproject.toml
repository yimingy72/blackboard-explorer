[project]
name = "bbx-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "bbx-contracts",
    "bbx-objects",
    "openai==3.17.0",
    "httpx2==2.13.0",
    "azure-identity>=1.25,<2",
    "azure-ai-projects>=2.6,<3",
    "google-auth[requests]>=2.58,<3",
    "mcp>=1.24,<2",
    "docker>=7,<8",
    "httpx>=0.28,<1",
    "opentelemetry-sdk==1.44.0",
    "socksio>=1,<2",
    "jinja2>=3.1,<4",
    "pyyaml>=6,<7",
    "asyncpg>=0.30,<1",
    "zstandard>=0.25,<1",
]

[tool.uv.sources]
bbx-objects = { workspace = true }
bbx-contracts = { workspace = true }

[project.scripts]
bbx-runtime = "bbx_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
