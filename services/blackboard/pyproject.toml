[project]
name = "bbx-blackboard"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["bbx-contracts", "sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.30,<1", "alembic>=1.16,<2", "pgvector>=0.4,<1"]

[tool.uv.sources]
bbx-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
