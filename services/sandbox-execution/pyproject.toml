[project]
name = "bbx-sandbox-execution"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["opensandbox==1.2.0"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1,<2",
    "testcontainers>=4.10,<5",
    "ruff>=0.11,<1",
    "pyright>=1.1.400,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbx_sandbox_execution"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: isolated Docker containers; no model or live target"]
