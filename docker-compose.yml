services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio-init:
    image: pgsty/minio:RELEASE.2026-04-17T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    networks: [internal]

  blackboard:
    image: bbx-blackboard:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET}
      ADMIN_USERS: ${ADMIN_USERS}
      PI_SITE_ID: ${PI_SITE_ID:-}
      PI_MODEL_AUTHORITY: ${PI_MODEL_AUTHORITY:-}
      PI_MODEL_OPERATOR: ${PI_MODEL_OPERATOR:-}
      PI_MODEL_ALLOWED_ORIGINS: ${PI_MODEL_ALLOWED_ORIGINS:-[]}
      PI_MODEL_PEER_CA_FILE: ${PI_MODEL_PEER_CA_FILE:-}
      PI_MODEL_RUNTIME_TOKEN: ${PI_MODEL_RUNTIME_TOKEN:-}
      PI_PLAYGROUND_RUNTIME_URL: ${PI_PLAYGROUND_RUNTIME_URL:-}
      SANDBOX_TENANT_RESOLVER_TOKEN: ${SANDBOX_TENANT_RESOLVER_TOKEN:-}
      NATIVE_CTF_PUBLICATION_FILE: ${NATIVE_CTF_PUBLICATION_FILE:-/run/bbx-publications/ctf-publication.json}
      BOARD_RUNNER_PUBLICATION_FILE: ${BOARD_RUNNER_PUBLICATION_FILE:-/run/bbx-publications/board-publication.json}
      LEGACY_NETWORK_POLICY_FILE:
    volumes:
      - ${BBX_PUBLICATION_DIR:-./runtime-publications}:/run/bbx-publications:ro
    ports:
      - "127.0.0.1:58000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  agent-runtime:
    image: bbx-agent-runtime:latest
    profiles: [shared-runtime]
    command: ["bbx-runtime", "serve"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BLACKBOARD_URL: http://blackboard:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      PI_RUNTIME_SENDER_TOKEN: ${PI_MODEL_RUNTIME_TOKEN:-}
      PI_PROVIDER_ALLOWED_ORIGINS: ${PI_MODEL_ALLOWED_ORIGINS:-[]}
      RUNNER_RESOURCE_CONFIG_FILE: ${RUNNER_RESOURCE_CONFIG_FILE:-/run/bbx-runtime/ctf-runtime.json}
      BOARD_RESOURCE_CONFIG_FILE: ${BOARD_RESOURCE_CONFIG_FILE:-/run/bbx-runtime/board-runtime.json}
      RUNNER_BLACKBOARD_URL: ${RUNNER_BLACKBOARD_URL:-}
      RUNNER_MODEL_PROXY_URL: ${RUNNER_MODEL_PROXY_URL:-}
      RUNNER_PROXY_HOST: ${RUNNER_PROXY_HOST:-0.0.0.0}
      RUNNER_PROXY_PORT: ${RUNNER_PROXY_PORT:-8081}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
      MAX_RUNNING_TASKS: ${MAX_RUNNING_TASKS:-2}
      NO_PROXY: localhost,127.0.0.1,::1,blackboard,postgres,minio,host.docker.internal
    volumes:
      - ${BBX_RUNTIME_CONFIG_DIR:-./runtime-config}:/run/bbx-runtime:ro
      - ${BBX_LINUX_KUBECTL_FILE:-./runtime-config/kubectl}:/usr/local/bin/kubectl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      blackboard:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 120s
    networks: [internal]

networks:
  internal: {}

volumes:
  postgres_data: {}
  minio_data: {}
