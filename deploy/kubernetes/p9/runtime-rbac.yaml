apiVersion: v1
kind: ServiceAccount
metadata: {name: bbx-runtime, namespace: bbx-platform}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: bbx-platform-task-bootstrap}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [servicecidrs]
    verbs: [list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [standard]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    resourceNames: [bbx-runtime, bbx-p9-sandbox-server]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [bbx-platform-task-resources, bbx-platform-sandbox-resources]
    verbs: [bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: bbx-platform-task-bootstrap}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bbx-platform-task-bootstrap}
subjects: [{kind: ServiceAccount, name: bbx-runtime, namespace: bbx-platform}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: bbx-platform-task-resources}
rules:
  - apiGroups: [""]
    resources: [serviceaccounts, resourcequotas, persistentvolumeclaims]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, create, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumendpoints]
    verbs: [get]
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes]
    verbs: [get]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: bbx-p9-sandbox-server, namespace: bbx-local-native}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: bbx-platform-sandbox-discovery}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: bbx-platform-sandbox-discovery}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: bbx-platform-sandbox-discovery}
subjects: [{kind: ServiceAccount, name: bbx-p9-sandbox-server, namespace: bbx-local-native}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: bbx-platform-sandbox-resources}
rules:
  - apiGroups: [sandbox.opensandbox.io]
    resources: [batchsandboxes]
    verbs: [create, get, list, watch, patch, update, delete]
  # The existing SDK list endpoint also enumerates this legacy resource in the Task namespace.
  - apiGroups: [sandbox.fast.io]
    resources: [sandboxes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services, persistentvolumeclaims]
    verbs: [get, list, watch]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: bbx-platform-task-namespace}
spec:
  failurePolicy: Fail
  matchConditions:
    - name: runtime
      expression: request.userInfo.username == 'system:serviceaccount:bbx-platform:bbx-runtime'
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [namespaces]
  variables:
    - name: taskID
      expression: object.metadata.labels['bbx.dev/task-id']
    - name: operationID
      expression: object.metadata.labels['bbx.dev/operation-id']
    - name: uuid
      expression: "'^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$'"
    - name: baseName
      expression: "'bbx-task-' + variables.taskID"
  validations:
    - expression: >-
        has(object.metadata.labels) && has(object.metadata.annotations) &&
        ['bbx.dev/managed-by','bbx.dev/task-id','bbx.dev/operation-id','bbx.dev/kubernetes-platform'].all(k, k in object.metadata.labels) &&
        'bbx.dev/source-id' in object.metadata.annotations &&
        object.metadata.labels['bbx.dev/managed-by'] == 'runner-resources' &&
        object.metadata.labels['bbx.dev/kubernetes-platform'] == 'bbx-platform' &&
        object.metadata.annotations['bbx.dev/source-id'] == 'bbx-local-native-1effbcb' &&
        variables.taskID.matches(variables.uuid) && variables.operationID.matches(variables.uuid) &&
        (object.metadata.name == variables.baseName ||
         object.metadata.name.matches('^' + variables.baseName + '-r[1-9][0-9]*$'))
      message: Runtime may create only original Blackboard task namespaces
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: bbx-platform-task-namespace}
spec:
  policyName: bbx-platform-task-namespace
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: bbx-platform-task-binding}
spec:
  failurePolicy: Fail
  matchConditions:
    - name: runtime
      expression: request.userInfo.username == 'system:serviceaccount:bbx-platform:bbx-runtime'
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [rolebindings]
  variables:
    - name: taskID
      expression: namespaceObject.metadata.labels['bbx.dev/task-id']
    - name: baseName
      expression: "'bbx-task-' + variables.taskID"
  validations:
    - expression: >-
        namespaceObject != null &&
        has(namespaceObject.metadata.labels) && has(namespaceObject.metadata.annotations) &&
        ['bbx.dev/managed-by','bbx.dev/task-id','bbx.dev/operation-id','bbx.dev/kubernetes-platform'].all(k, k in namespaceObject.metadata.labels) &&
        'bbx.dev/source-id' in namespaceObject.metadata.annotations &&
        has(object.metadata.labels) && has(object.metadata.annotations) &&
        ['bbx.dev/managed-by','bbx.dev/task-id','bbx.dev/operation-id'].all(k, k in object.metadata.labels) &&
        'bbx.dev/source-id' in object.metadata.annotations &&
        namespaceObject.metadata.labels['bbx.dev/managed-by'] == 'runner-resources' &&
        namespaceObject.metadata.labels['bbx.dev/kubernetes-platform'] == 'bbx-platform' &&
        namespaceObject.metadata.annotations['bbx.dev/source-id'] == 'bbx-local-native-1effbcb' &&
        variables.taskID.matches('^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$') &&
        (request.namespace == variables.baseName ||
         request.namespace.matches('^' + variables.baseName + '-r[1-9][0-9]*$')) &&
        object.metadata.annotations['bbx.dev/source-id'] == 'bbx-local-native-1effbcb' &&
        object.metadata.labels['bbx.dev/task-id'] == variables.taskID &&
        object.metadata.labels['bbx.dev/operation-id'] == namespaceObject.metadata.labels['bbx.dev/operation-id'] &&
        object.metadata.labels['bbx.dev/managed-by'] == 'runner-resources' &&
        object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
        object.roleRef.kind == 'ClusterRole' && has(object.subjects) &&
        size(object.subjects) == 1 && object.subjects[0].kind == 'ServiceAccount' &&
        ((object.metadata.name == 'bbx-runtime' && object.roleRef.name == 'bbx-platform-task-resources' &&
          object.subjects[0].name == 'bbx-runtime' && object.subjects[0].namespace == 'bbx-platform') ||
         (object.metadata.name == 'bbx-p9-sandbox-server' && object.roleRef.name == 'bbx-platform-sandbox-resources' &&
          object.subjects[0].name == 'bbx-p9-sandbox-server' && object.subjects[0].namespace == 'bbx-local-native'))
      message: Runtime may bind only fixed P9 task roles in the owning P9 task namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: bbx-platform-task-binding}
spec:
  policyName: bbx-platform-task-binding
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: bbx-platform-task-pod}
spec:
  failurePolicy: Fail
  matchConditions:
    - name: runtime
      expression: request.userInfo.username == 'system:serviceaccount:bbx-platform:bbx-runtime'
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [pods]
  variables:
    - name: pod
      expression: object.spec
    - name: containers
      expression: >-
        variables.pod.containers + (has(variables.pod.initContainers) ? variables.pod.initContainers : [])
    - name: vpnImage
      expression: "'bbx-p4m-vpn-sandbox@sha256:05a46bc49dc8e0123063a304b4c531020f651b3b82c5b0a2aeea4f4ee8181ccb'"
  validations:
    - expression: >-
        (!has(variables.pod.hostNetwork) || !variables.pod.hostNetwork) &&
        (!has(variables.pod.hostPID) || !variables.pod.hostPID) &&
        (!has(variables.pod.hostIPC) || !variables.pod.hostIPC) &&
        (!has(variables.pod.shareProcessNamespace) || !variables.pod.shareProcessNamespace) &&
        (!has(variables.pod.ephemeralContainers) || size(variables.pod.ephemeralContainers) == 0) &&
        has(variables.pod.automountServiceAccountToken) && !variables.pod.automountServiceAccountToken &&
        (!has(variables.pod.volumes) || variables.pod.volumes.all(v,
          has(v.emptyDir) ||
          (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in ['bbx-journal','bbx-workspace']) ||
          (has(v.secret) && v.secret.secretName in ['bbx-runner','bbx-sandbox-host','bbx-vpn-egress']))) &&
        variables.containers.all(c,
          has(c.securityContext) &&
          (!has(c.securityContext.privileged) || !c.securityContext.privileged) &&
          has(c.securityContext.allowPrivilegeEscalation) && !c.securityContext.allowPrivilegeEscalation &&
          (!has(c.ports) || c.ports.all(p, !has(p.hostPort) || p.hostPort == 0)) &&
          (!has(c.securityContext.capabilities) || !has(c.securityContext.capabilities.add) ||
           size(c.securityContext.capabilities.add) == 0 ||
           (object.metadata.name == 'bbx-runner' && c.name == 'vpn-egress' && c.image == variables.vpnImage &&
            c.securityContext.capabilities.add == ['NET_ADMIN'] &&
            c.command == ['/usr/bin/env','-i','/usr/bin/python3','-I','-S','/opt/bbx/control/task-vpn.py'] &&
            c.args == ['egress'])))
      message: Runtime pods must keep the original task isolation boundary
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: bbx-platform-task-pod}
spec:
  policyName: bbx-platform-task-pod
  validationActions: [Deny]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata: {name: bbx-platform-task-claim}
spec:
  failurePolicy: Fail
  matchConditions:
    - name: runtime
      expression: request.userInfo.username == 'system:serviceaccount:bbx-platform:bbx-runtime'
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE]
        resources: [persistentvolumeclaims]
  validations:
    - expression: >-
        object.metadata.name in ['bbx-journal','bbx-workspace'] &&
        object.spec.storageClassName == 'standard' &&
        object.spec.accessModes == ['ReadWriteOnce'] &&
        (!has(object.spec.volumeMode) || object.spec.volumeMode == 'Filesystem') &&
        (!has(object.spec.volumeName) || object.spec.volumeName == '') &&
        !has(object.spec.selector) && !has(object.spec.dataSource) && !has(object.spec.dataSourceRef)
      message: Runtime may dynamically provision only original task storage claims
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata: {name: bbx-platform-task-claim}
spec:
  policyName: bbx-platform-task-claim
  validationActions: [Deny]
