apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: bbx-platform
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: bbx-platform
spec:
  serviceName: postgres
  replicas: 0
  selector: {matchLabels: {app.kubernetes.io/name: postgres}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: postgres, containerPort: 5432}]
          envFrom: [{secretRef: {name: postgres-auth}}]
          env: [{name: PGDATA, value: /data/pgdata}]
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
          resources:
            requests: {cpu: 150m, memory: 256Mi}
            limits: {cpu: "1", memory: 1024Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: socket, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - {name: socket, emptyDir: {sizeLimit: 64Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: shm, emptyDir: {medium: Memory, sizeLimit: 256Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: bbx-platform-retain
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: bbx-platform
spec:
  selector: {app.kubernetes.io/name: minio}
  ports: [{name: s3, port: 9000, targetPort: s3}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: bbx-platform
spec:
  serviceName: minio
  replicas: 0
  selector: {matchLabels: {app.kubernetes.io/name: minio}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: minio}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: docker.io/pgsty/minio@sha256:83885c27b3b5b673049e33ddf4029afe2c134fd51ce4309e65e4f39d3b9ca282
          imagePullPolicy: Never
          command: [minio, server, /data, --console-address, ":9001"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: s3, containerPort: 9000}]
          envFrom: [{secretRef: {name: minio-auth}}]
          env: [{name: HOME, value: /tmp}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: s3}}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: bbx-platform-retain
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
