apiVersion: v1
kind: Service
metadata:
  name: bbx-p9-sandbox-server
  namespace: bbx-local-native
spec:
  selector: {app.kubernetes.io/instance: bbx-p9-sandbox-server}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbx-p9-sandbox-server
  namespace: bbx-local-native
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/instance: bbx-p9-sandbox-server}}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: bbx-p9-sandbox-server
        app.kubernetes.io/name: opensandbox-server
        app.kubernetes.io/part-of: opensandbox
    spec:
      serviceAccountName: bbx-p9-sandbox-server
      enableServiceLinks: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: main
          image: bbx-local-native-server-g7:1effbcb@sha256:82b9fceaca5767170f7596c8ac3ec35332ebc6a203ff0fb526f4f76a197f6293
          imagePullPolicy: Never
          args: [--config, /etc/opensandbox/config.toml]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: SANDBOX_CONFIG_PATH, value: /etc/opensandbox/config.toml}
            - {name: SSL_CERT_FILE, value: /run/bbx/ca/ca.pem}
            - {name: HOME, value: /tmp}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - name: OPENSANDBOX_SECURE_ACCESS_KEYS
              valueFrom: {secretKeyRef: {name: bbx-p3f-signing, key: keys}}
            - name: OPENSANDBOX_SECURE_ACCESS_ACTIVE_KEY
              valueFrom: {secretKeyRef: {name: bbx-p3f-signing, key: active-key}}
          readinessProbe: {httpGet: {path: /health, port: http}}
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/opensandbox/config.toml, subPath: config.toml, readOnly: true}
            - {name: template, mountPath: /etc/opensandbox/p3f-template.json, subPath: template.json, readOnly: true}
            - {name: ca, mountPath: /run/bbx/ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: config, secret: {secretName: bbx-p9-sandbox-server-config}}
        - {name: template, configMap: {name: bbx-p9-sandbox-template}}
        - {name: ca, configMap: {name: bbx-p9-platform-control-ca}}
