fullnameOverride: bbx-archv2-g1-k8s-server
namespaceOverride: bbx-archv2-g1-k8s-system
server:
  image:
    repository: opensandbox/server
    tag: release-1.2.0@sha256:25bebdcf1cf7724eb923faecbdbbf82d4038c6ab35c736151574726d14006f30
    pullPolicy: IfNotPresent
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
  env:
    - {name: SANDBOX_TENANTS_CONFIG_PATH, value: /etc/opensandbox/g1-tenants.toml}
  gateway:
    enabled: true
    gatewayRouteMode: header
    secureAccess:
      existingSecret: bbx-archv2-g1-k8s-signing
  volumeMounts:
    - {name: template, mountPath: /etc/opensandbox/g1-template.json, subPath: template.json, readOnly: true}
    - {name: tenants, mountPath: /etc/opensandbox/g1-tenants.toml, subPath: tenants.toml, readOnly: true}
  volumes:
    - name: template
      configMap: {name: bbx-archv2-g1-k8s-template}
    - name: tenants
      secret: {secretName: bbx-archv2-g1-k8s-tenants}
configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  api_key = ""
  [log]
  level = "WARNING"
  [runtime]
  type = "kubernetes"
  execd_image = "opensandbox/execd:release-1.2.0@sha256:c75836c46ef4302afccec182d5d7339eb2f905f51e3d73b7aa17bb76c832526c"
  execd_run_as_init = true
  [kubernetes]
  namespace = "bbx-archv2-g1-k8s-task"
  workload_provider = "batchsandbox"
  batchsandbox_template_file = "/etc/opensandbox/g1-template.json"
  image_pull_policy = "IfNotPresent"
  read_qps = 20
  read_burst = 40
  [kubernetes.execd_init_resources]
  requests = {cpu = "10m", memory = "32Mi"}
  limits = {cpu = "200m", memory = "128Mi"}
  [tenants]
  provider = "file"
