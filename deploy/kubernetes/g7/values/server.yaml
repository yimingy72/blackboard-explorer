fullnameOverride: bbx-archv2-g7-server
namespaceOverride: bbx-archv2-g7-system
server:
  image:
    repository: bbx-archv2-server-g7
    tag: bbx-g7-direct-1
    pullPolicy: Never
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
  gateway:
    enabled: true
    gatewayRouteMode: header
    secureAccess:
      existingSecret: bbx-archv2-g7-signing
  volumeMounts:
    - {name: template, mountPath: /etc/opensandbox/g7-template.yaml, subPath: template.yaml, readOnly: true}
  volumes:
    - name: template
      configMap: {name: bbx-archv2-g7-template}
configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  api_key = ""
  [log]
  level = "WARNING"
  [runtime]
  type = "kubernetes"
  execd_image = "opensandbox/execd:release-1.2.0@sha256:c75836c46ef4302afccec182d5d7339eb2f905f51e3d73b7aa17bb76c832526c"
  execd_run_as_init = true
  [kubernetes]
  namespace = "bbx-archv2-g7-task-a"
  workload_provider = "batchsandbox"
  batchsandbox_template_file = "/etc/opensandbox/g7-template.yaml"
  batchsandbox_informer_enabled = false
  read_qps = 20
  read_burst = 40
  [kubernetes.execd_init_resources]
  requests = {cpu = "10m", memory = "32Mi"}
  limits = {cpu = "200m", memory = "128Mi"}
  [tenants]
  provider = "http"
  endpoint = "http://bbx-archv2-g7-tenant.bbx-archv2-g7-system.svc:8080/tenant"
  cache_max_entries = 1
  max_stale_seconds = 0
  timeout_seconds = 2
